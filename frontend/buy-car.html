<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car World — Purchase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --gold-dark: #b8943d;
      --bg: #0d0d1a;
      --card: #1a1a2e;
      --text: #f5f5f5;
      --muted: #b8b8c8;
      --border: rgba(201, 168, 76, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at top, rgba(201, 168, 76, 0.14), transparent 40%), var(--bg);
    }

    .card {
      width: min(900px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(90deg, rgba(201, 168, 76, 0.16), rgba(201, 168, 76, 0.04));
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin: 0 0 8px;
      color: var(--gold);
    }

    .card-subtitle { color: var(--muted); margin: 0; }

    .card-body { padding: 28px; }

    .summary {
      background: linear-gradient(135deg, rgba(201, 168, 76, 0.14), rgba(255,255,255,0.03));
      border: 1px solid rgba(201, 168, 76, 0.24);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 20px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .summary-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .summary-label {
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.4px;
    }

    .summary-value {
      color: var(--text);
      font-weight: 600;
      text-align: right;
    }

    .summary-value strong {
      color: var(--gold);
    }

    .form-label { color: var(--text); font-weight: 500; }
    .form-control, .form-select, textarea {
      background: var(--bg);
      border: 1px solid rgba(201, 168, 76, 0.35);
      color: var(--text);
      border-radius: 8px;
    }

    .form-control:focus, .form-select:focus, textarea:focus {
      background: var(--bg);
      color: var(--text);
      border-color: var(--gold);
      box-shadow: 0 0 0 0.2rem rgba(201, 168, 76, 0.2);
    }

    .payment-options {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid rgba(201, 168, 76, 0.24);
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(201, 168, 76, 0.08));
      transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    }

    .payment-option:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
      background: linear-gradient(135deg, rgba(201, 168, 76, 0.12), rgba(255,255,255,0.03));
    }

    .payment-option input {
      accent-color: var(--gold);
      margin-top: 0;
    }

    .payment-option-label {
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
      display: block;
      width: 100%;
    }

    .btn-submit {
      background: var(--gold);
      color: #0d0d1a;
      border: none;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 8px;
      width: 100%;
    }

    .btn-submit:hover {
      background: var(--gold-dark);
    }

    .alert-success {
      margin-top: 18px;
      background: rgba(201, 168, 76, 0.15);
      border: 1px solid rgba(201, 168, 76, 0.35);
      color: #f8e7b6;
      border-radius: 8px;
      padding: 12px 14px;
    }

    .alert-danger {
      margin-top: 18px;
      background: rgba(220, 53, 69, 0.14);
      border: 1px solid rgba(220, 53, 69, 0.32);
      color: #ffb8bf;
      border-radius: 8px;
      padding: 12px 14px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="card-header">
        <h1 class="card-title">Complete Your Purchase</h1>
        <p class="card-subtitle">Reserve your selected luxury vehicle with a few details.</p>
      </div>
      <div class="card-body">
        <div class="summary">
          <div class="summary-row">
            <span class="summary-label">Selected Vehicle</span>
            <span class="summary-value" id="carName">-</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Estimated Price</span>
            <span class="summary-value"><strong id="carPrice">-</strong></span>
          </div>
        </div>

        <form id="purchaseForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="fullName">Full Name</label>
              <input class="form-control" id="fullName" name="fullName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="email">Email Address</label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="phone">Phone Number</label>
              <input class="form-control" id="phone" name="phone" required pattern="[0-9]{10}">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="address">Address / City</label>
              <input class="form-control" id="address" name="address" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="state">State</label>
              <select class="form-select" id="state" name="state" required>
                <option value="">Select state</option>
                <option>Andhra Pradesh</option>
                <option>Arunachal Pradesh</option>
                <option>Assam</option>
                <option>Bihar</option>
                <option>Chhattisgarh</option>
                <option>Goa</option>
                <option>Gujarat</option>
                <option>Haryana</option>
                <option>Himachal Pradesh</option>
                <option>Jharkhand</option>
                <option>Karnataka</option>
                <option>Kerala</option>
                <option>Madhya Pradesh</option>
                <option>Maharashtra</option>
                <option>Manipur</option>
                <option>Meghalaya</option>
                <option>Mizoram</option>
                <option>Nagaland</option>
                <option>Odisha</option>
                <option>Punjab</option>
                <option>Rajasthan</option>
                <option>Sikkim</option>
                <option>Tamil Nadu</option>
                <option>Telangana</option>
                <option>Tripura</option>
                <option>Uttar Pradesh</option>
                <option>Uttarakhand</option>
                <option>West Bengal</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="pinCode">PIN Code</label>
              <input class="form-control" id="pinCode" name="pinCode" required pattern="[0-9]{6}">
            </div>
            <div class="col-12">
              <label class="form-label">Payment Method</label>
              <div class="payment-options">
                <div class="payment-option">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="fullPayment" value="Full Payment" checked>
                  <label class="payment-option-label" for="fullPayment">Full Payment</label>
                </div>
                <div class="payment-option">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="emi" value="EMI">
                  <label class="payment-option-label" for="emi">EMI</label>
                </div>
                <div class="payment-option">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="loan" value="Loan">
                  <label class="payment-option-label" for="loan">Loan</label>
                </div>
              </div>
            </div>
            <div class="col-12 hidden" id="emiGroup">
              <label class="form-label" for="emiTenure">EMI Tenure</label>
              <select class="form-select" id="emiTenure" name="emiTenure">
                <option value="">Select tenure</option>
                <option value="12">12 months</option>
                <option value="24">24 months</option>
                <option value="36">36 months</option>
                <option value="48">48 months</option>
                <option value="60">60 months</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="notes">Additional Notes</label>
              <textarea class="form-control" id="notes" name="notes" rows="4"></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn-submit">Submit Purchase Request</button>
            </div>
          </div>
        </form>

        <div id="messageBox"></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const carId = params.get('carId') || '';
    const carName = params.get('carName') || 'Selected car';
    const carPrice = params.get('carPrice') || '';

    document.getElementById('carName').textContent = carName;
    document.getElementById('carPrice').textContent = carPrice ? `₹${Number(carPrice).toLocaleString('en-IN')}` : 'Price on request';

    const paymentRadios = document.querySelectorAll('input[name="paymentMethod"]');
    const emiGroup = document.getElementById('emiGroup');

    paymentRadios.forEach((radio) => {
      radio.addEventListener('change', () => {
        emiGroup.classList.toggle('hidden', radio.value !== 'EMI');
      });
    });

    const form = document.getElementById('purchaseForm');
    const messageBox = document.getElementById('messageBox');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      messageBox.innerHTML = '';

      const selectedPayment = document.querySelector('input[name="paymentMethod"]:checked')?.value || '';

      const payload = {
        carId,
        carName,
        carPrice,
        fullName: form.fullName.value.trim(),
        email: form.email.value.trim(),
        phone: form.phone.value.trim(),
        address: form.address.value.trim(),
        state: form.state.value,
        pinCode: form.pinCode.value.trim(),
        paymentMethod: selectedPayment,
        emiTenure: form.emiTenure?.value || '',
        notes: form.notes.value.trim(),
      };

      try {
        const response = await fetch('http://localhost:5000/api/orders/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        let data = {};
        try {
          data = await response.json();
        } catch (parseError) {
          data = {};
        }

        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Unable to submit request. Please make sure the backend is running.');
        }

        messageBox.innerHTML = `<div class="alert-success">Purchase request submitted successfully. Your order ID is <strong>${data.orderId}</strong>.</div>`;
        form.reset();
      } catch (error) {
        messageBox.innerHTML = `<div class="alert-danger">${error.message}</div>`;
      }
    });
  </script>
</body>
</html>
